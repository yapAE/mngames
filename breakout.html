<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>打砖块 · 摸鱼游戏厅</title><link rel="stylesheet" href="shared.css">
<style>#cv{background:#1C1917;border:1px solid var(--line-strong);border-radius:var(--radius);width:min(88vw,390px);height:min(62vh,430px);touch-action:none}</style>
</head>
<body class="tone-indigo">
<div class="topbar"><a class="home" href="index.html">游戏厅</a><div class="title">打砖块</div>
  <div class="stats"><div class="stat"><div class="k">分数</div><div class="v" id="score">0</div></div></div></div>
<div class="game-wrap"><div class="panel" style="position:relative;padding:10px;">
  <canvas id="cv" width="390" height="430"></canvas>
  <div class="overlay" id="over" hidden><div id="overText">游戏结束</div><button class="btn" onclick="start()">再来一局</button></div>
</div>
<div class="controls"><button class="btn" onclick="start()">新游戏</button></div>
<p class="tip">← → 移动挡板，点画布也能控制。打光所有砖块过关，球掉下去扣一条命。</p></div>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=390,H=430;
let bricks=[],ball,paddle,score,lives,timer,running=false;
function initBricks(){bricks=[];const cols=9,rows=5,bw=(W-20)/cols,bh=22;
  const cs=['#F87171','#FB923C','#FACC15','#4ADE80','#38BDF8'];
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)bricks.push({x:10+c*bw,y:36+r*(bh+5),w:bw-4,h:bh,color:cs[r],alive:true});}
function start(){initBricks();ball={x:W/2,y:H-50,dx:3.2,dy:-3.8,r:7};paddle={x:W/2-42,w:84};
  score=0;lives=3;running=true;document.getElementById('over').hidden=true;document.getElementById('score').textContent=0;
  clearInterval(timer);timer=setInterval(step,16);draw();}
function step(){if(!running)return;
  ball.x+=ball.dx;ball.y+=ball.dy;
  if(ball.x<ball.r||ball.x>W-ball.r)ball.dx*=-1;
  if(ball.y<ball.r)ball.dy*=-1;
  if(ball.y>H+20){lives--;if(lives<=0){running=false;clearInterval(timer);
      document.getElementById('overText').textContent='游戏结束 · '+score+' 分';document.getElementById('over').hidden=false;}
    else{ball.x=W/2;ball.y=H-50;ball.dx=3.2;ball.dy=-3.8;}}
  if(ball.y+ball.r>paddle.y&&ball.y<paddle.y+12&&ball.x>paddle.x&&ball.x<paddle.x+paddle.w&&ball.dy>0){
    ball.dy=-Math.abs(ball.dy);ball.dx+=(ball.x-(paddle.x+paddle.w/2))*.06;}
  bricks.forEach(b=>{if(!b.alive)return;
    if(ball.x>b.x-ball.r&&ball.x<b.x+b.w+ball.r&&ball.y>b.y-ball.r&&ball.y<b.y+b.h+ball.r){
      b.alive=false;ball.dy*=-1;score+=10;document.getElementById('score').textContent=score;}});
  if(bricks.every(b=>!b.alive)){running=false;clearInterval(timer);
    document.getElementById('overText').textContent='🎉 通关！'+score+' 分';document.getElementById('over').hidden=false;}
  draw();}
function draw(){ctx.fillStyle='#1C1917';ctx.fillRect(0,0,W,H);
  bricks.forEach(b=>{if(b.alive){ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);}});
  ctx.fillStyle='#F97316';ctx.fillRect(paddle.x,paddle.y,paddle.w,10);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')paddle.x=Math.max(0,paddle.x-22);
  if(e.key==='ArrowRight')paddle.x=Math.min(W-paddle.w,paddle.x+22);});
cv.addEventListener('mousemove',e=>{const r=cv.getBoundingClientRect();paddle.x=(e.clientX-r.left)/r.width*W-paddle.w/2;});
cv.addEventListener('touchmove',e=>{const r=cv.getBoundingClientRect();paddle.x=(e.touches[0].clientX-r.left)/r.width*W-paddle.w/2;},{passive:true});
start();
</script><script src="shared.js"></script></body></html>
