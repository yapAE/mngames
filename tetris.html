<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>俄罗斯方块 · 摸鱼游戏厅</title><link rel="stylesheet" href="shared.css">
<style>
  #grid { display:grid; grid-template-columns:repeat(10,1fr); grid-template-rows:repeat(18,1fr);
    width:min(78vw,272px); height:min(60vh,490px); gap:1px; background:var(--line);
    border:1px solid var(--line-strong); border-radius:var(--radius); overflow:hidden; }
  .px { background:#FFFBEB; }
  .i{background:#22D3EE}.j{background:#3B82F6}.l{background:#F97316}
  .o{background:#FACC15}.s{background:#4ADE80}.t{background:#C084FC}.z{background:#F87171}
  .play { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }
  .next-box { background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px;text-align:center; }
  #next { display:grid;grid-template-columns:repeat(4,18px);grid-template-rows:repeat(4,18px);gap:1px;margin:0 auto 6px; }
  #next .px{background:#FFFBEB}
  .dpad{display:grid;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(2,44px);gap:6px;justify-content:center;margin-top:12px}
  .dpad button{border:1px solid var(--line-strong);background:var(--surface);color:var(--accent-hover);border-radius:var(--radius);font-size:19px;font-weight:900;cursor:pointer}
</style>
</head>
<body class="tone-indigo">
<div class="topbar"><a class="home" href="index.html">游戏厅</a><div class="title">俄罗斯方块</div>
  <div class="stats"><div class="stat"><div class="k">分数</div><div class="v" id="score">0</div></div></div></div>
<div class="game-wrap"><div class="play">
  <div class="panel" style="position:relative;padding:10px;"><div id="grid"></div>
    <div class="overlay" id="over" hidden><div>游戏结束</div><button class="btn" onclick="start()">再来一局</button></div></div>
  <div>
    <div class="next-box"><div style="font-size:12px;color:var(--ink-2);margin-bottom:6px;font-weight:700">下一个</div><div id="next"></div></div>
    <div class="dpad">
      <button onclick="rot()">↻</button><button onclick="move(0,1)">→</button><button></button>
      <button onclick="move(0,-1)">←</button><button onclick="drop()">↓</button><button></button>
    </div>
  </div>
</div>
<p class="tip">← → 移动，↑ 旋转，↓ 加速，空格直接落下。手机点右侧按钮。</p></div>
<script>
const W=10,H=18;
const SHAPES={i:[[0,1],[1,1],[2,1],[3,1]],j:[[0,0],[0,1],[1,1],[2,1]],l:[[2,0],[0,1],[1,1],[2,1]],
  o:[[0,0],[1,0],[0,1],[1,1]],s:[[1,0],[2,0],[0,1],[1,1]],t:[[1,0],[0,1],[1,1],[2,1]],z:[[0,0],[1,0],[1,1],[2,1]]};
const COLS=Object.keys(SHAPES);
let board=[],cur,curColor,nxt,timer,score=0,over=false;
const gridEl=document.getElementById('grid'),nextEl=document.getElementById('next');
for(let i=0;i<W*H;i++){const d=document.createElement('div');d.className='px';gridEl.appendChild(d);}
for(let i=0;i<16;i++){const d=document.createElement('div');d.className='px';nextEl.appendChild(d);}
function newPiece(){const c=COLS[Math.floor(Math.random()*COLS.length)];
  return {cells:SHAPES[c].map(p=>p.slice()),color:c,x:c==='o'?4:3,y:0};}
function draw(){
  const cells=gridEl.children;
  const b=board.map(r=>r.slice());
  if(cur)cur.cells.forEach(([cx,cy])=>{const x=cur.x+cx,y=cur.y+cy;if(y>=0&&y<H&&x>=0&&x<W)b[y][x]=cur.color;});
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)cells[y*W+x].className='px '+(b[y][x]||'');
  const nc=nextEl.children; for(let i=0;i<16;i++)nc[i].className='px';
  if(nxt)nxt.cells.forEach(([cx,cy])=>{nc[cy*4+cx].className='px '+nxt.color;});
  document.getElementById('score').textContent=score;
}
function collide(p){return p.cells.some(([cx,cy])=>{const x=p.x+cx,y=p.y+cy;
  return x<0||x>=W||y>=H||(y>=0&&board[y][x]);});}
function lock(){
  cur.cells.forEach(([cx,cy])=>{const y=cur.y+cy,x=cur.x+cx;if(y>=0)board[y][x]=cur.color;});
  let cleared=0;
  for(let y=H-1;y>=0;y--){if(board[y].every(v=>v)){board.splice(y,1);board.unshift(Array(W).fill(null));cleared++;y++;}}
  score+=[0,100,300,500,800][cleared]||0;
  cur=nxt||newPiece();nxt=newPiece();
  if(collide(cur)){over=true;clearInterval(timer);document.getElementById('over').hidden=false;}
  draw();
}
function move(dx,dy){if(over)return;const p={cells:cur.cells,x:cur.x+dx,y:cur.y+dy,color:cur.color};
  if(!collide(p)){cur=p;draw();}else if(dy>0)lock();}
function rot(){if(over)return;const p={cells:cur.cells.map(([x,y])=>[-y,x]),x:cur.x,y:cur.y,color:cur.color};
  let k=0;while(collide(p)&&k<3){p.x--;k++;}if(!collide(p)){cur=p;draw();}}
function drop(){if(over)return;while(!collide({cells:cur.cells,x:cur.x,y:cur.y+1,color:cur.color}))cur.y++;lock();}
function start(){board=Array.from({length:H},()=>Array(W).fill(null));score=0;over=false;
  cur=newPiece();nxt=newPiece();document.getElementById('over').hidden=true;
  clearInterval(timer);timer=setInterval(()=>move(0,1),650);draw();}
document.addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();
  if(e.key==='ArrowLeft')move(-1,0);if(e.key==='ArrowRight')move(1,0);
  if(e.key==='ArrowUp')rot();if(e.key==='ArrowDown')move(0,1);if(e.key===' ')drop();});
start();
</script><script src="shared.js"></script></body></html>
